name: Build and Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - assignment-03

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t assignment03 .

      - name: Create deployment package
        run: zip -r deploy.zip . -x "*.git*" "node_modules/*" ".github/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate version label
        id: version
        run: echo "label=v-${GITHUB_SHA::7}-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Get EB S3 bucket
        id: eb_bucket
        run: |
          BUCKET=$(aws elasticbeanstalk create-storage-location --query S3Bucket 
--output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT

      - name: Upload bundle to S3
        run: |
          aws s3 cp deploy.zip s3://${{ steps.eb_bucket.outputs.bucket }}/${{ 
steps.version.outputs.label }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APPLICATION_NAME }}" \
            --version-label "${{ steps.version.outputs.label }}" \
            --source-bundle S3Bucket=${{ steps.eb_bucket.outputs.bucket }},S3Key=${{ 
steps.version.outputs.label }}.zip

      - name: Deploy to Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ steps.version.outputs.label }}"
